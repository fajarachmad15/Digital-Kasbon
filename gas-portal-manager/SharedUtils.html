<script>
  /**
   * ============================================================================
   * MODULE: SharedUtils.html
   * DESCRIPTION: Client-side utilities (Terbilang, Rupiah, Image Compression,
   *              and :user-invalid + aria-invalid form validation bridge)
   * ============================================================================
   */
  const KasbonClientUtils = (function () {
    const UNITS = [
      '', 'Satu', 'Dua', 'Tiga', 'Empat', 'Lima',
      'Enam', 'Tujuh', 'Delapan', 'Sembilan', 'Sepuluh', 'Sebelas'
    ];

    function terbilangCore(n) {
      n = Math.floor(Math.abs(Number(n) || 0));
      if (n === 0) return '';
      if (n < 12) return UNITS[n];
      if (n < 20) return (terbilangCore(n - 10) + ' Belas').trim();
      if (n < 100) return (UNITS[Math.floor(n / 10)] + ' Puluh ' + terbilangCore(n % 10)).trim();
      if (n < 200) return ('Seratus ' + terbilangCore(n - 100)).trim();
      if (n < 1000) return (UNITS[Math.floor(n / 100)] + ' Ratus ' + terbilangCore(n % 100)).trim();
      if (n < 2000) return ('Seribu ' + terbilangCore(n - 1000)).trim();
      if (n < 1000000) return (terbilangCore(Math.floor(n / 1000)) + ' Ribu ' + terbilangCore(n % 1000)).trim();
      if (n < 1000000000) return (terbilangCore(Math.floor(n / 1000000)) + ' Juta ' + terbilangCore(n % 1000000)).trim();
      if (n < 1000000000000) return (terbilangCore(Math.floor(n / 1000000000)) + ' Miliar ' + terbilangCore(n % 1000000000)).trim();
      return String(n);
    }

    function formatTerbilang(amount) {
      const val = Math.floor(Number(amount) || 0);
      if (val <= 0) return 'Nol Rupiah';
      return terbilangCore(val).replace(/\s+/g, ' ').trim() + ' Rupiah';
    }

    function formatRupiah(amount) {
      const val = Math.floor(Number(amount) || 0);
      return 'Rp ' + val.toLocaleString('id-ID');
    }

    /**
     * Reads a file from an <input type="file">, compressing images via multi-stage
     * adaptive HTML5 Canvas to strictly keep photos compact (~100-220 KB, well under 1 MB)
     * before uploading to Google Drive.
     */
    function prepareFilePayload(fileInput, maxDimension, targetMaxBytes) {
      maxDimension = maxDimension || 1400;
      targetMaxBytes = targetMaxBytes || (220 * 1024); // Target <= 220 KB per photo

      return new Promise(function (resolve, reject) {
        if (!fileInput || !fileInput.files || fileInput.files.length === 0) {
          resolve(null);
          return;
        }
        const file = fileInput.files[0];
        if (file.size > 20 * 1024 * 1024) {
          reject(new Error('Ukuran file asli terlalu besar (Maks 20MB).'));
          return;
        }

        // If PDF, read directly as Base64 (must be under 1 MB / 2 MB)
        if (file.type === 'application/pdf') {
          if (file.size > 2 * 1024 * 1024) {
            reject(new Error('Ukuran PDF maksimal 2MB. Disarankan unggah foto nota yang akan dikompresi otomatis.'));
            return;
          }
          const reader = new FileReader();
          reader.onload = function (e) {
            const b64 = e.target.result.split(',')[1];
            resolve({
              base64: b64,
              mimeType: 'application/pdf',
              fileName: file.name,
              originalBytes: file.size,
              compressedBytes: file.size
            });
          };
          reader.onerror = function () { reject(new Error('Gagal membaca file PDF.')); };
          reader.readAsDataURL(file);
          return;
        }

        // If Image, run adaptive multi-stage Canvas compression
        const imgReader = new FileReader();
        imgReader.onload = function (ev) {
          const img = new Image();
          img.onload = function () {
            let currentMaxDim = maxDimension;
            let quality = 0.80;
            let base64Out = '';
            let byteLength = 0;

            const renderCompressed = function (dimLimit, q) {
              let width = img.width;
              let height = img.height;
              if (width > dimLimit || height > dimLimit) {
                if (width > height) {
                  height = Math.round((height * dimLimit) / width);
                  width = dimLimit;
                } else {
                  width = Math.round((width * dimLimit) / height);
                  height = dimLimit;
                }
              }
              const canvas = document.createElement('canvas');
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              // Fill white background so transparent PNGs remain legible in JPEG
              ctx.fillStyle = '#ffffff';
              ctx.fillRect(0, 0, width, height);
              ctx.drawImage(img, 0, 0, width, height);
              const dataUrl = canvas.toDataURL('image/jpeg', q);
              const b64 = dataUrl.split(',')[1];
              const bytes = Math.ceil((b64.length * 3) / 4);
              return { b64: b64, bytes: bytes };
            };

            // Stage 1..4: Adaptive quality & resolution step-down until <= targetMaxBytes
            const attempts = [
              { dim: currentMaxDim, q: 0.80 },
              { dim: currentMaxDim, q: 0.70 },
              { dim: 1200, q: 0.62 },
              { dim: 1024, q: 0.54 }
            ];

            for (let i = 0; i < attempts.length; i++) {
              const res = renderCompressed(attempts[i].dim, attempts[i].q);
              base64Out = res.b64;
              byteLength = res.bytes;
              if (byteLength <= targetMaxBytes) {
                break;
              }
            }

            resolve({
              base64: base64Out,
              mimeType: 'image/jpeg',
              fileName: file.name.replace(/\.[^.]+$/, '') + '.jpg',
              originalBytes: file.size,
              compressedBytes: byteLength
            });
          };
          img.onerror = function () { reject(new Error('File gambar tidak valid.')); };
          img.src = ev.target.result;
        };
        imgReader.onerror = function () { reject(new Error('Gagal membaca file gambar.')); };
        imgReader.readAsDataURL(file);
      });
    }

    /**
     * Attaches live compression preview indicator to all <input type="file"> controls.
     */
    function attachFileCompressionPreview(rootEl) {
      const container = rootEl || document;
      const fileInputs = container.querySelectorAll('input[type="file"]');
      fileInputs.forEach(function (inp) {
        if (inp.dataset.compressBound === '1') return;
        inp.dataset.compressBound = '1';

        inp.addEventListener('change', function () {
          let badge = inp.parentNode.querySelector('.compress-preview-badge');
          if (!inp.files || inp.files.length === 0) {
            if (badge) badge.style.display = 'none';
            return;
          }
          if (!badge) {
            badge = document.createElement('div');
            badge.className = 'compress-preview-badge';
            badge.style.cssText = 'margin-top:0.35rem; font-size:0.8rem; font-weight:600; color:#166534; background:#dcfce7; padding:0.35rem 0.65rem; border-radius:6px; display:inline-block;';
            inp.parentNode.appendChild(badge);
          }
          const rawFile = inp.files[0];
          const origKB = (rawFile.size / 1024).toFixed(0);
          badge.style.display = 'inline-block';
          badge.textContent = '⏳ Mengompresi ukuran foto (' + origKB + ' KB)...';

          prepareFilePayload(inp).then(function (res) {
            if (!res) return;
            const compKB = Math.max(1, Math.round(res.compressedBytes / 1024));
            const savedPct = res.originalBytes > res.compressedBytes
              ? Math.round((1 - (res.compressedBytes / res.originalBytes)) * 100)
              : 0;
            if (res.mimeType === 'application/pdf') {
              badge.textContent = '✅ File PDF siap diunggah ke Google Drive (' + compKB + ' KB)';
            } else {
              badge.textContent = '✅ Terkompresi otomatis: ' + origKB + ' KB ➔ ' + compKB + ' KB' + (savedPct > 0 ? ' (Hemat ' + savedPct + '% kuota Drive)' : '') + ' — Siap diunggah ke Google Drive';
            }
          }).catch(function (err) {
            badge.style.color = '#d93025';
            badge.style.background = '#fce8e6';
            badge.textContent = '❌ ' + (err.message || err);
          });
        });
      });
    }

    /**
     * Synchronizes :user-invalid visual state with aria-invalid for accessibility,
     * plus WeakMap fallback for browsers without native :user-invalid support.
     */
    function initFormValidation(formEl) {
      attachFileCompressionPreview(document);
      if (!formEl) return;
      const dirtyState = new WeakMap();
      const supportsUserInvalid = typeof CSS !== 'undefined' && CSS.supports && CSS.supports('selector(:user-invalid)');

      const syncAriaInvalid = function (input) {
        if (!input || typeof input.checkValidity !== 'function') return;
        const valid = input.checkValidity();
        if (!supportsUserInvalid) {
          input.classList.toggle('user-invalid-fallback', !valid);
          input.classList.toggle('user-valid-fallback', valid);
        }
        if (!valid) {
          input.setAttribute('aria-invalid', 'true');
        } else {
          input.removeAttribute('aria-invalid');
        }
      };

      formEl.addEventListener('blur', function (e) {
        if (e.target && e.target.matches('.form-control[required]')) {
          const st = dirtyState.get(e.target) || { interacted: false, blurred: false };
          st.blurred = true;
          dirtyState.set(e.target, st);
          if (supportsUserInvalid || st.interacted) {
            syncAriaInvalid(e.target);
          }
        }
      }, true);

      formEl.addEventListener('input', function (e) {
        if (e.target && e.target.matches('.form-control[required]')) {
          const st = dirtyState.get(e.target) || { interacted: false, blurred: false };
          st.interacted = true;
          dirtyState.set(e.target, st);
          if (e.target.checkValidity() || st.blurred) {
            syncAriaInvalid(e.target);
          }
        }
      });

      formEl.addEventListener('submit', function () {
        formEl.querySelectorAll('.form-control[required]').forEach(syncAriaInvalid);
      });
    }

    document.addEventListener('DOMContentLoaded', function () {
      attachFileCompressionPreview(document);
    });

    return {
      formatTerbilang: formatTerbilang,
      formatRupiah: formatRupiah,
      prepareFilePayload: prepareFilePayload,
      attachFileCompressionPreview: attachFileCompressionPreview,
      initFormValidation: initFormValidation
    };
  })();
</script>
