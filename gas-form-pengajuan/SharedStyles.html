<style>
  :root {
    --brand-primary: #c8102e;
    --brand-primary-hover: #a50d26;
    --brand-secondary: #0f172a;
    --bg-surface: #f8fafc;
    --bg-card: #ffffff;
    --text-main: #0f172a;
    --text-muted: #475569;
    --border-color: #e2e8f0;
    --success-bg: #dcfce7;
    --success-text: #166534;
    --success-border: #188038;
    --warning-bg: #fef9c3;
    --warning-text: #854d0e;
    --danger-bg: #fce8e6;
    --danger-text: #d93025;
    --info-bg: #e0f2fe;
    --info-text: #075985;
    --radius-md: 10px;
    --radius-lg: 14px;
    --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
    --shadow-md: 0 4px 16px rgba(15, 23, 42, 0.08);
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background-color: var(--bg-surface);
    color: var(--text-main);
    line-height: 1.5;
  }

  /* Corporate Top Navbar */
  .corp-navbar {
    background: var(--brand-secondary);
    color: #ffffff;
    padding: 0.85rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 3px solid var(--brand-primary);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .corp-brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    font-weight: 700;
    font-size: 1.1rem;
    letter-spacing: -0.01em;
  }

  .corp-badge-pill {
    background: var(--brand-primary);
    color: #fff;
    padding: 0.2rem 0.6rem;
    border-radius: 6px;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
  }

  .corp-container {
    max-width: 960px;
    margin: 1.75rem auto;
    padding: 0 1rem;
  }

  .corp-container-wide {
    max-width: 1320px;
    margin: 1.5rem auto;
    padding: 0 1.25rem;
  }

  .corp-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 1.5rem;
    box-shadow: var(--shadow-sm);
    margin-bottom: 1.25rem;
  }

  .corp-card-header {
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 0.85rem;
    margin-bottom: 1.25rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.5rem;
  }

  .corp-card-title {
    margin: 0;
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--brand-secondary);
  }

  /* Form Controls & Modern :user-invalid Validation */
  .field-group {
    margin-bottom: 1.15rem;
  }

  .field-label {
    display: block;
    font-weight: 600;
    font-size: 0.875rem;
    margin-bottom: 0.35rem;
    color: var(--text-main);
  }

  .req-star {
    color: var(--danger-text);
    margin-left: 2px;
  }

  .form-control {
    width: 100%;
    padding: 0.625rem 0.85rem;
    font-size: 0.95rem;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    background-color: #fff;
    color: var(--text-main);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .form-control:focus {
    outline: none;
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }

  .form-control:disabled,
  .form-control[readonly] {
    background-color: #f1f5f9;
    color: #475569;
    cursor: not-allowed;
  }

  .error-msg {
    display: none;
    color: var(--danger-text);
    font-size: 0.825rem;
    font-weight: 500;
    margin-top: 0.3rem;
  }

  /* Post-interaction validation feedback (:user-invalid + fallback) */
  .form-control:user-invalid,
  .form-control.user-invalid-fallback {
    border-color: var(--danger-text);
    background-color: var(--danger-bg);
  }

  .form-control:user-invalid + .error-msg,
  .form-control.user-invalid-fallback + .error-msg {
    display: block;
  }

  .form-control:required:user-valid,
  .form-control.user-valid-fallback {
    border-color: var(--success-border);
    border-width: 1.5px;
  }

  /* Terbilang Box */
  .terbilang-box {
    background: #f8fafc;
    border-left: 4px solid var(--brand-primary);
    padding: 0.65rem 1rem;
    border-radius: 0 8px 8px 0;
    font-weight: 700;
    font-size: 1rem;
    color: var(--brand-secondary);
    margin-top: 0.4rem;
  }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.45rem;
    padding: 0.65rem 1.25rem;
    font-size: 0.925rem;
    font-weight: 600;
    border-radius: 8px;
    border: 1px solid transparent;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.15s ease;
  }

  .btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .btn-primary {
    background-color: var(--brand-primary);
    color: #ffffff;
  }
  .btn-primary:hover:not(:disabled) {
    background-color: var(--brand-primary-hover);
  }

  .btn-success {
    background-color: #16a34a;
    color: #ffffff;
  }
  .btn-success:hover:not(:disabled) {
    background-color: #15803d;
  }

  .btn-danger {
    background-color: #dc2626;
    color: #ffffff;
  }
  .btn-danger:hover:not(:disabled) {
    background-color: #b91c1c;
  }

  .btn-outline {
    background-color: #ffffff;
    border-color: #cbd5e1;
    color: var(--text-main);
  }
  .btn-outline:hover:not(:disabled) {
    background-color: #f1f5f9;
  }

  .btn-block {
    width: 100%;
  }

  /* Grid Helpers */
  .grid-2 {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1rem;
  }
  .grid-4 {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1rem;
  }
  @media (max-width: 768px) {
    .grid-2, .grid-4 {
      grid-template-columns: 1fr;
    }
  }

  /* Details Summary Table */
  .info-grid {
    display: grid;
    grid-template-columns: 210px 1fr;
    row-gap: 0.55rem;
    column-gap: 1rem;
    font-size: 0.925rem;
  }
  .info-label {
    color: var(--text-muted);
    font-weight: 500;
  }
  .info-val {
    color: var(--text-main);
    font-weight: 600;
  }
  @media (max-width: 600px) {
    .info-grid {
      grid-template-columns: 1fr;
      row-gap: 0.25rem;
    }
    .info-val {
      margin-bottom: 0.5rem;
    }
  }

  /* Status Badges */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    padding: 0.25rem 0.65rem;
    border-radius: 999px;
    font-size: 0.775rem;
    font-weight: 600;
    white-space: nowrap;
  }
  .badge-wait { background: var(--warning-bg); color: var(--warning-text); }
  .badge-done { background: var(--success-bg); color: var(--success-text); }
  .badge-reject { background: var(--danger-bg); color: var(--danger-text); }
  .badge-info { background: var(--info-bg); color: var(--info-text); }

  /* Alerts */
  .alert {
    padding: 0.9rem 1.1rem;
    border-radius: 8px;
    margin-bottom: 1rem;
    font-size: 0.92rem;
    font-weight: 500;
  }
  .alert-error { background: var(--danger-bg); color: var(--danger-text); border: 1px solid #f5c2c7; }
  .alert-success { background: var(--success-bg); color: var(--success-text); border: 1px solid #badbcc; }
  .alert-info { background: var(--info-bg); color: var(--info-text); border: 1px solid #b6effb; }
  .alert-warning { background: var(--warning-bg); color: var(--warning-text); border: 1px solid #ffecb5; }
</style>
